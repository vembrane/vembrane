source = { editable = "." }
dependencies = [
    { name = "asttokens" },
    { name = "cyvcf2" },
    { name = "intervaltree" },
    { name = "networkx" },
    { name = "numpy" },
    { name = "obonet" },
    { name = "pyarrow" },
    { name = "pysam" },
    { name = "pyyaml" },
    { name = "typing-extensions" },
    { name = "yte" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "polars" },
    { name = "pre-commit" },
    { name = "pyarrow-stubs" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "tox" },
    { name = "tox-uv" },
    { name = "types-networkx" },
    { name = "types-pyyaml" },
]
lint = [
    { name = "mypy" },
    { name = "pyarrow-stubs" },
    { name = "ruff" },
    { name = "types-networkx" },
    { name = "types-pyyaml" },
]
test = [
    { name = "polars" },
    { name = "pytest" },
    { name = "pytest-sugar" },
]

[package.metadata]
requires-dist = [
    { name = "asttokens", specifier = "~=3.0" },
    { name = "cyvcf2", specifier = ">=0.31.1,<0.35.0" },
    { name = "intervaltree", specifier = "~=3.1" },
    { name = "networkx", specifier = "~=3.5" },
    { name = "numpy", specifier = "~=2.1" },
    { name = "obonet", specifier = "~=1.1" },
    { name = "pyarrow", specifier = ">=22.0.0" },
    { name = "pysam", specifier = ">=0.23.3,<0.25.0" },
    { name = "pyyaml", specifier = "~=6.0" },
    { name = "typing-extensions", specifier = "~=4.12" },
    { name = "yte", specifier = "~=1.9" },
]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = "~=1.17" },
    { name = "polars" },
    { name = "pre-commit", specifier = "~=4.2" },
    { name = "pyarrow-stubs", specifier = "~=20.0.0.20251215" },
    { name = "pytest", specifier = "~=8.4" },
    { name = "ruff", specifier = "~=0.12" },
    { name = "tox", specifier = "~=4.24" },
    { name = "tox-uv", specifier = "~=1.25" },
    { name = "types-networkx", specifier = "~=3.5" },
    { name = "types-pyyaml", specifier = "~=6.0" },
]
lint = [
    { name = "mypy" },
    { name = "pyarrow-stubs" },
    { name = "ruff" },
    { name = "types-networkx" },
    { name = "types-pyyaml" },
]
test = [
    { name = "polars" },
    { name = "pytest" },
    { name = "pytest-sugar" },
]

